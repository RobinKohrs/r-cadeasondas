# .github/workflows/update-forecasts.yml
name: Update Surf Forecasts

on:
  workflow_dispatch: # Allows manual triggering
  schedule:
    # Runs every 2 hours
    - cron: "0 */2 * * *"

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"

      - name: Install R dependencies
        run: |
          install.packages(c("jsonlite", "glue", "dplyr", "purrr", "furrr"))
        shell: Rscript {0}

      - name: Download all spot forecasts
        run: Rscript R/download_forecasts.R

      - name: Commit and push if there are changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          # The following command exits with 0 if there are no changes, and 1 if there are.
          # This prevents the workflow from failing if there's nothing to commit.
          git diff --staged --quiet || git commit -m "Update surf forecast data"
          git push
